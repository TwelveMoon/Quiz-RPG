<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>池東守護者</title>
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/TwelveMoon/Quiz-RPG/refs/heads/main/ChiDongRPG.jpg">
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/TwelveMoon/Quiz-RPG/refs/heads/main/ChiDongRPG.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
        
        /* 遊戲本體先隱藏 (透明度 0) */
        iframe { width: 100%; height: 100%; border: none; display: block; opacity: 0; transition: opacity 0.8s ease-in-out; }
        
        /* 啟動畫面樣式 (最上層) */
        #splash-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.8s ease-in-out;
        }
        .logo { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 30px; box-shadow: 0 0 30px rgba(250, 204, 21, 0.4); }
        .spinner { border: 5px solid #334155; border-top: 5px solid #facc15; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .title { color: #facc15; font-size: 28px; font-weight: bold; text-shadow: 0 0 15px rgba(250, 204, 21, 0.5); letter-spacing: 2px; margin-bottom: 10px; }
        .loading-text { color: #94a3b8; font-size: 14px; letter-spacing: 1px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* 🌟 新增：警示畫面樣式 (夾在中間層) */
        #warning-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; /* 純黑底色更具質感 */
            display: flex; justify-content: center; align-items: center;
            z-index: 5000; opacity: 0; transition: opacity 0.8s ease-in-out;
            pointer-events: none; /* 隱藏時不阻擋點擊 */
        }
        #warning-screen img {
            width: 100%; height: 100%; object-fit: contain; /* 確保警示圖完美符合手機比例且不變形 */
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="https://raw.githubusercontent.com/TwelveMoon/Quiz-RPG/refs/heads/main/ChiDongRPG.jpg" class="logo">
        <div class="spinner"></div>
        <div class="title">池東守護者</div>
        <div class="loading-text">魔法陣連線中...</div>
    </div>

    <div id="warning-screen">
        <img src="https://raw.githubusercontent.com/TwelveMoon/Quiz-RPG/refs/heads/main/openwarning.png" alt="遊戲警示">
    </div>

    <iframe id="game-frame" src="https://script.google.com/macros/s/AKfycbxGHAG4ULIPbDpVdyXbtiKq1KWVSbOmdu56zHhgLJJUCwRC7hp89k5IdG3Bha5LtLqa/exec" onload="startTransition()"></iframe>

    <script>
        let isTransitionStarted = false; // 紀錄是否已經開始過場

        // 🌟 啟動三段式過場動畫
        function startTransition() {
            if (isTransitionStarted) return; // 避免重複執行
            isTransitionStarted = true;

            const splash = document.getElementById('splash-screen');
            const warning = document.getElementById('warning-screen');
            const game = document.getElementById('game-frame');
            
            // 階段 1：淡出載入畫面，淡入警示畫面
            splash.style.opacity = '0';
            warning.style.opacity = '1';
            
            // 0.8 秒後將載入畫面徹底移除
            setTimeout(() => {
                splash.style.display = 'none';
            }, 800);

            // 階段 2：警示畫面停留 3 秒後 (加上淡入的 0.8 秒，大約在第 3.8 秒開始淡出)
            setTimeout(() => {
                warning.style.opacity = '0';
                game.style.opacity = '1'; // 同時淡入遊戲本體
                
                // 動畫結束後把警示畫面移走，確保玩家可以正常點擊遊戲
                setTimeout(() => {
                    warning.style.display = 'none';
                }, 800);
            }, 3800);
        }

        // 🛡️ 終極防呆機制：如果 iframe 等了 8 秒還沒觸發 onload，強制啟動過場程序
        setTimeout(() => {
            if (!isTransitionStarted) {
                console.log("Iframe 載入過久，強制啟動進入程序");
                startTransition();
            }
        }, 8000); 
// 🛡️ 終極防呆機制：如果 iframe 等了 8 秒還沒觸發 onload，強制啟動過場程序
        setTimeout(() => {
            if (!isTransitionStarted) {
                console.log("Iframe 載入過久，強制啟動進入程序");
                startTransition();
            }
        }, 8000); 
        
        // 🌟 新增：註冊 Service Worker 讓安卓認定這是一個 App
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
